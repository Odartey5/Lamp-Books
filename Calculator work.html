<!DOCTYPE html>
<html >
<head>
    <link href="Cal work.css" rel="stylesheet"> </link>
    <title>Calculator</title>
</head>
<body>
     <div id="calculator">
        <input id="display" placeholder="0"></input>
        <div id="keys">
             <button onclick="clicktoDisplay('7')">7</button>
             <button onclick="clicktoDisplay('8')">8</button>
             <button onclick="clicktoDisplay('9')">9</button>
             <button onclick="clicktoDisplay('/')" class="opr">/</button>
             <button onclick="clicktoDisplay('4')">4</button>
             <button onclick="clicktoDisplay('5')">5</button>
             <button onclick="clicktoDisplay('6')">6</button>
             <button onclick="clicktoDisplay('*')" class="opr">*</button>
             <button onclick="clicktoDisplay('1')">1</button>
             <button onclick="clicktoDisplay('2')">2</button>
             <button onclick="clicktoDisplay('3')">3</button>
             <button onclick="clicktoDisplay('+')" class="opr">+</button>
             <button onclick="clicktoDisplay('0')">0</button>
             <button onclick="clicktoDisplay('.')" class="opr">.</button>
             <button onclick="calculate()" class="opr">=</button>
             <button onclick="clicktoDisplay('-')" class="opr">-</button>
             <button id="bg"  onclick="clicktoClear('c')" class="clear">c</button>
             <button id="bg"  onclick="clicktoDelete('del')" class="delete">del</button>

        </div>
   </div>

   <script>

    const display = document.getElementById("display");

    function clicktoDisplay(input){
         // Check if the input is a valid number or operator
         const validCharas = "0123456789+-*/.";
         if (validCharas.includes(input) || (input === '0' && display.value === '')){
              display.value += input;
         }   
    }

    function clicktoClear(){
         display.value = "";
    }

    function clicktoDelete(){
         display.value = display.value.slice(0, -1);
    }

    function calculate(){
         try{
              display.value = eval(display.value);
         }
         catch(error){
              display.value = "error";
         }  
    }
</script>
</body>
<footer>&copy; Lamp-Books</footer>
</html>
